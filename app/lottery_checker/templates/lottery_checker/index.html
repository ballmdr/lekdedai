{% extends 'base.html' %}
{% load static %}

{% block title %}ตรวจหวย - LekDedAI{% endblock %}

{% block content %}
{% csrf_token %}
<div class="min-h-screen bg-background py-8">
    <div class="container mx-auto px-4">
        <!-- Header Section -->
        <div class="text-center mb-8">
            <h1 class="text-4xl font-bold text-foreground mb-2">
                <i aria-hidden="true" class="fas fa-search text-primary mr-3"></i>
                ตรวจหวย
            </h1>
            <p class="text-lg text-muted-foreground">ตรวจสอบเลขหวยของคุณกับผลรางวัลล่าสุด</p>
        </div>

        <!-- Main Form Section -->
        <div class="max-w-2xl mx-auto card p-8 mb-8">
            <div class="mb-6">
                <label for="lottoInput" class="block text-lg font-semibold text-foreground mb-3">
                    <i aria-hidden="true" class="fas fa-edit text-primary mr-2"></i>
                    กรอกเลขสลาก (สูงสุด 10 หมายเลข, คั่นด้วยคอมมา)
                </label>
                <input 
                    type="text" 
                    id="lottoInput" 
                    placeholder="เช่น 123456, 654321, 789012" 
                    class="input text-lg"
                    onkeypress="handleEnterKey(event)"
                >
            </div>

            <div class="mb-6">
                <label for="lottoDate" class="block text-lg font-semibold text-foreground mb-3">
                    <i aria-hidden="true" class="fas fa-calendar text-primary mr-2"></i>
                    เลือกวันที่ออกรางวัล
                </label>
                <select 
                    id="lottoDate" 
                    class="input text-lg"
                >
                    {% for option in draw_date_options %}
                        <option value="{{ option.value }}" {% if option.is_special %}class="special-date"{% endif %}>
                            {{ option.label }}
                        </option>
                    {% endfor %}
                </select>
            </div>

            <button 
                onclick="checkLottoAndLoadFullResults()" 
                class="btn btn-primary w-full py-4 text-xl"
            >
                <i aria-hidden="true" class="fas fa-search mr-2"></i>
                ตรวจหวย
            </button>

            <!-- Result Display -->
            <div id="lottoResult" class="mt-6 p-4 bg-muted/50 rounded-lg border-l-4 border-primary hidden">
                <!-- Results will be displayed here -->
            </div>
        </div>

        <!-- Lottery Results Display Section -->
        <div class="max-w-6xl mx-auto card p-8">
            <div class="text-center mb-8">
                <h2 class="text-3xl font-bold text-foreground">
                    <i aria-hidden="true" class="fas fa-trophy text-primary mr-3"></i>
                    ผลสลากกินแบ่งรัฐบาล
                </h2>
            </div>
            <div id="latestLottoResult" class="text-center text-muted-foreground text-lg">
                <div class="animate-pulse">
                    <div class="inline-block w-8 h-8 bg-primary rounded-full mb-4"></div>
                    <p>กำลังโหลดข้อมูลรางวัล...</p>
                </div>
            </div>
            
        </div>
    </div>
</div>

<script>
// Get CSRF token
function getCSRFToken() {
    const token = document.querySelector('[name=csrfmiddlewaretoken]')?.value;
    if (token) return token;
    
    // Try to get from cookie
    const cookies = document.cookie.split(';');
    for (let cookie of cookies) {
        const [name, value] = cookie.trim().split('=');
        if (name === 'csrftoken') {
            return value;
        }
    }
    return null;
}

// ฟังก์ชันสำหรับแปลงวันที่เป็นภาษาไทย
function formatThaiDate(selectedDate) {
    const monthNamesThai = [
        "มกราคม", "กุมภาพันธ์", "มีนาคม", "เมษายน", "พฤษภาคม", "มิถุนายน",
        "กรกฎาคม", "สิงหาคม", "กันยายน", "ตุลาคม", "พฤศจิกายน", "ธันวาคม"
    ];
    
    const dateParts = selectedDate.split('-');
    const year = parseInt(dateParts[0]);
    const month = parseInt(dateParts[1]);
    const date = parseInt(dateParts[2]);
    
    const thaiMonth = monthNamesThai[month - 1];
    const thaiYear = year + 543;
    
    return `${date} ${thaiMonth} ${thaiYear}`;
}

// ฟังก์ชันหลักเมื่อกดปุ่ม "ตรวจหวย"
async function checkLottoAndLoadFullResults() {
    const selectedDate = document.getElementById("lottoDate").value;
    
    // 1. เรียกฟังก์ชันตรวจหวยรายเลข
    await checkLotto(selectedDate);

    // 2. เรียกฟังก์ชันแสดงผลรางวัลทั้งหมด
    await loadLottoResultsForDate(selectedDate);
}

// ฟังก์ชันสำหรับดึงข้อมูลรางวัลทั้งหมดตามวันที่ที่เลือก
async function loadLottoResultsForDate(selectedDateFull) {
    const displayDiv = document.getElementById("latestLottoResult");
    displayDiv.innerHTML = `
        <div class="animate-pulse">
            <div class="inline-block w-8 h-8 bg-purple-400 rounded-full mb-4"></div>
            <p>กำลังโหลดข้อมูลรางวัล...</p>
        </div>
    `;

    const dateParts = selectedDateFull.split('-');
    const year = dateParts[0];
    const month = dateParts[1];
    const date = dateParts[2];

    const payload = {
        date: date,
        month: month,
        year: year
    };

    try {
        const res = await fetch("/lottery_checker/api/lotto/result/", {
            method: "POST",
            headers: {
                "Content-Type": "application/json",
                "X-CSRFToken": getCSRFToken()
            },
            body: JSON.stringify(payload)
        });

        const data = await res.json();

        if (!data || !data.success) {
            displayDiv.innerHTML = `
                <div class="text-red-500 text-xl font-semibold text-center">
                    <div class="mb-4">
                        <svg class="w-16 h-16 mx-auto text-red-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-2.5L13.732 4c-.77-.833-1.964-.833-2.732 0L3.732 16.5c-.77.833.192 2.5 1.732 2.5z"></path>
                        </svg>
                    </div>
                    <p>❌ ไม่สามารถโหลดข้อมูลรางวัลได้</p>
                    <p class="text-sm text-gray-600 mt-2">${data.error || 'เกิดข้อผิดพลาดที่ไม่ทราบสาเหตุ'}</p>
                </div>
            `;
            return;
        }

        // ตรวจสอบว่ามีข้อมูลรางวัลหรือไม่
        if (!data.data || !data.data.response || !data.data.response.result || !data.data.response.result.data) {
            displayDiv.innerHTML = `
                <div class="text-orange-500 text-xl font-semibold text-center">
                    <div class="mb-4">
                        <svg class="w-16 h-16 mx-auto text-orange-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-2.5L13.732 4c-.77-.833-1.964-.833-2.732 0L3.732 16.5c-.77.833.192 2.5 1.732 2.5z"></path>
                        </svg>
                    </div>
                    <p>⚠️ ไม่มีข้อมูลรางวัลสำหรับงวดวันที่ ${formatThaiDate(selectedDateFull)}</p>
                    <p class="text-sm text-gray-600 mt-2">อาจเป็นเพราะยังไม่มีการออกรางวัล หรือข้อมูลยังไม่ถูกอัปเดต</p>
                </div>
            `;
            return;
        }
        
        const lottoData = data.data.response.result.data;
        const formattedDate = formatThaiDate(selectedDateFull);
        const period = data.data.response.result.period && data.data.response.result.period.length > 0 ? data.data.response.result.period[0] : 'N/A';

        // ตรวจสอบความถูกต้องของข้อมูล
        const validationResult = validateLottoData(lottoData);
        if (!validationResult.is_valid) {
            displayDiv.innerHTML = `
                <div class="text-red-500 text-xl font-semibold text-center">
                    <div class="mb-4">
                        <svg class="w-16 h-16 mx-auto text-red-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-2.5L13.732 4c-.77-.833-1.964-.833-2.732 0L3.732 16.5c-.77.833.192 2.5 1.732 2.5z"></path>
                        </svg>
                    </div>
                    <p>🚨 ข้อมูลรางวัลผิดพลาดสำหรับงวดวันที่ ${formattedDate}</p>
                    <p class="text-sm text-gray-600 mt-2">${validationResult.error}</p>
                </div>
            `;
            return;
        }

        let htmlContent = `
            <div class="mb-8">
                <h3 class="text-2xl font-bold text-gray-800 mb-2">งวดวันที่ ${formattedDate}</h3>
                <p class="text-gray-600">งวดที่ ${period}</p>
            </div>
        `;

        // รางวัลที่ 1
        const firstPrizeNumber = lottoData.first?.number[0]?.value || 'N/A';
        
        // เลขหน้า 3 ตัว และเลขท้าย 3 ตัว
        let front3Numbers = 'N/A';
        let last3Numbers = 'N/A';
        let last2Number = 'N/A';

        if (lottoData.last3f?.number) {
            front3Numbers = lottoData.last3f.number.map(item => item.value).join(' ');
        }
        
        if (lottoData.last3b?.number) {
            last3Numbers = lottoData.last3b.number.map(item => item.value).join(' ');
        }
        
        if (lottoData.last2?.number) {
            last2Number = lottoData.last2.number[0].value;
        }

        // รางวัลข้างเคียง
        let near1Numbers = [];
        if (lottoData.near1?.number) {
            near1Numbers = lottoData.near1.number.map(item => item.value);
        }

        // Prize Grid
        htmlContent += `
            <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6 mb-8">
                <div class="card prize-tile prize-sky p-6 text-center">
                    <h4 class="text-lg font-semibold mb-2">รางวัลที่ 1</h4>
                    <p class="text-sm mb-3 opacity-90">1 รางวัล รางวัลละ 6,000,000 บาท</p>
                    <div class="text-3xl font-bold">${firstPrizeNumber}</div>
                </div>
                
                <div class="card prize-tile prize-mint p-6 text-center">
                    <h4 class="text-lg font-semibold mb-2">เลขหน้า 3 ตัว</h4>
                    <p class="text-sm mb-3 opacity-90">2 รางวัล รางวัลละ 4,000 บาท</p>
                    <div class="text-2xl font-bold">${front3Numbers}</div>
                </div>
                
                <div class="card prize-tile prize-lilac p-6 text-center">
                    <h4 class="text-lg font-semibold mb-2">เลขท้าย 3 ตัว</h4>
                    <p class="text-sm mb-3 opacity-90">2 รางวัล รางวัลละ 4,000 บาท</p>
                    <div class="text-2xl font-bold">${last3Numbers}</div>
                </div>
                
                <div class="card prize-tile prize-butter p-6 text-center">
                    <h4 class="text-lg font-semibold mb-2">เลขท้าย 2 ตัว</h4>
                    <p class="text-sm mb-3 opacity-90">1 รางวัล รางวัลละ 2,000 บาท</p>
                    <div class="text-2xl font-bold">${last2Number}</div>
                </div>
            </div>
        `;

        // รางวัลข้างเคียง
        if (near1Numbers.length > 0) {
            htmlContent += `
                <div class="card prize-tile prize-cloud p-6 text-center mb-8">
                    <h4 class="text-xl font-semibold mb-2">รางวัลข้างเคียงรางวัลที่ 1</h4>
                    <p class="text-sm mb-3 opacity-90">2 รางวัล รางวัลละ 100,000 บาท</p>
                    <div class="text-2xl font-bold">${near1Numbers.join(' ')}</div>
                </div>
            `;
        }

        // รางวัลที่ 2
        if (lottoData.second?.number && lottoData.second.number.length > 0) {
            htmlContent += `
                <div class="card p-6 mb-8">
                    <h4 class="text-2xl font-bold text-foreground text-center mb-4">
                        <i aria-hidden="true" class="fas fa-medal text-secondary mr-2"></i>
                        รางวัลที่ 2 (5 รางวัล รางวัลละ 200,000 บาท)
                    </h4>
                    <div class="flex flex-wrap justify-center gap-3">
            `;
            lottoData.second.number.forEach(item => {
                htmlContent += `<span class="badge prize-badge-mint px-4 py-2 font-semibold text-lg">${item.value}</span>`;
            });
            htmlContent += `</div></div>`;
        }

        // รางวัลที่ 3
        if (lottoData.third?.number && lottoData.third.number.length > 0) {
            htmlContent += `
                <div class="card p-6 mb-8">
                    <h4 class="text-2xl font-bold text-foreground text-center mb-4">
                        <i aria-hidden="true" class="fas fa-award text-accent mr-2"></i>
                        รางวัลที่ 3 (10 รางวัล รางวัลละ 80,000 บาท)
                    </h4>
                    <div class="flex flex-wrap justify-center gap-3">
            `;
            lottoData.third.number.forEach(item => {
                htmlContent += `<span class="badge prize-badge-lilac px-4 py-2 font-semibold">${item.value}</span>`;
            });
            htmlContent += `</div></div>`;
        }

        // รางวัลที่ 4
        if (lottoData.fourth?.number && lottoData.fourth.number.length > 0) {
            htmlContent += `
                <div class="card mb-8">
                    <button type="button" class="w-full p-6 flex items-center justify-between" aria-expanded="false" aria-controls="fourthPrizeList" onclick="togglePrize(this, 'fourthPrizeList')">
                        <h4 class="text-2xl font-bold text-foreground">
                            <i aria-hidden="true" class="fas fa-gift text-primary mr-2" aria-hidden="true"></i>
                            รางวัลที่ 4 (50 รางวัล รางวัลละ 40,000 บาท)
                        </h4>
                        <i aria-hidden="true" class="fas fa-chevron-down text-muted-foreground transition-transform" aria-hidden="true"></i>
                    </button>
                    <div id="fourthPrizeList" class="hidden px-6 pb-6">
                        <div class="grid grid-cols-2 md:grid-cols-4 lg:grid-cols-6 gap-3">
            `;
            lottoData.fourth.number.forEach(item => {
                htmlContent += `<span class="badge badge-outline px-3 py-2 font-semibold text-center">${item.value}</span>`;
            });
            htmlContent += `</div></div></div>`;
        }

        // รางวัลที่ 5
        if (lottoData.fifth?.number && lottoData.fifth.number.length > 0) {
            htmlContent += `
                <div class="card mb-8">
                    <button type="button" class="w-full p-6 flex items-center justify-between" aria-expanded="false" aria-controls="fifthPrizeList" onclick="togglePrize(this, 'fifthPrizeList')">
                        <h4 class="text-2xl font-bold text-foreground">
                            <i aria-hidden="true" class="fas fa-star text-primary mr-2" aria-hidden="true"></i>
                            รางวัลที่ 5 (100 รางวัล รางวัลละ 20,000 บาท)
                        </h4>
                        <i aria-hidden="true" class="fas fa-chevron-down text-muted-foreground transition-transform" aria-hidden="true"></i>
                    </button>
                    <div id="fifthPrizeList" class="hidden px-6 pb-6">
                        <div class="grid grid-cols-2 md:grid-cols-4 lg:grid-cols-6 gap-3">
            `;
            lottoData.fifth.number.forEach(item => {
                htmlContent += `<span class="badge badge-outline px-3 py-2 font-semibold text-center">${item.value}</span>`;
            });
            htmlContent += `</div></div></div>`;
        }

        displayDiv.innerHTML = htmlContent;

    } catch (err) {
        console.error("Error loading full lotto results:", err);
        
        displayDiv.innerHTML = `
            <div class="text-red-500 text-xl font-semibold text-center">
                <div class="mb-4">
                    <svg class="w-16 h-16 mx-auto text-red-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-2.5L13.732 4c-.77-.833-1.964-.833-2.732 0L3.732 16.5c-.77.833.192 2.5 1.732 2.5z"></path>
                    </svg>
                </div>
                <p>🚨 เกิดข้อผิดพลาดในการดึงข้อมูลรางวัล</p>
                <p class="text-sm text-gray-600 mt-2">${err.message || 'เกิดข้อผิดพลาดที่ไม่ทราบสาเหตุ'}</p>
            </div>
        `;
    }
}

// ฟังก์ชันตรวจหวยรายเลข
async function checkLotto(selectedDate) {
    const input = document.getElementById("lottoInput").value.trim();
    const resultDiv = document.getElementById("lottoResult");

    if (!input) {
        resultDiv.innerHTML = `
            <div class="text-orange-600 text-center">
                <p class="text-lg">กรุณากรอกเลขหวยที่ต้องการตรวจสอบ</p>
            </div>
        `;
        resultDiv.classList.remove('hidden');
        return;
    }

    resultDiv.innerHTML = `
        <div class="text-center">
            <div class="inline-block w-6 h-6 bg-purple-400 rounded-full animate-spin mb-2"></div>
            <p class="text-lg text-gray-600">กำลังตรวจสอบ...</p>
        </div>
    `;
    resultDiv.classList.remove('hidden');

    const rawEntries = input.split(",").map(n => n.trim()).filter(Boolean);
    const invalidEntries = rawEntries.filter(n => !/^\d{6}$/.test(n));
    const numbers = rawEntries.filter(n => /^\d{6}$/.test(n)).slice(0, 10);

    if (invalidEntries.length > 0) {
        // แจ้งรายการที่ไม่ถูกต้อง (ไม่ตัดทิ้งเงียบ ๆ) — สร้าง DOM ปลอดภัยจาก XSS
        const wrapper = document.createElement("div");
        wrapper.className = "text-red-600 text-center";
        const line1 = document.createElement("p");
        line1.className = "text-lg";
        line1.textContent = "❌ พบรายการที่ไม่ถูกต้อง (ต้องเป็นเลข 6 หลัก):";
        const line2 = document.createElement("p");
        line2.className = "text-sm mt-1";
        line2.textContent = invalidEntries.join(", ");
        wrapper.appendChild(line1);
        wrapper.appendChild(line2);
        resultDiv.innerHTML = "";
        resultDiv.appendChild(wrapper);
        resultDiv.classList.remove("hidden");
        return;
    }

    if (numbers.length === 0) {
        resultDiv.innerHTML = `
            <div class="text-red-600 text-center">
                <p class="text-lg">❌ กรุณากรอกเลข 6 หลัก อย่างน้อย 1 หมายเลข</p>
            </div>
        `;
        return;
    }

    const dateParts = selectedDate.split('-');
    const year = dateParts[0];
    const month = dateParts[1];
    const date = dateParts[2];

    try {
        const res = await fetch("/lottery_checker/api/lotto/result/", {
            method: "POST",
            headers: {
                "Content-Type": "application/json",
                "X-CSRFToken": getCSRFToken()
            },
            body: JSON.stringify({
                date: date,
                month: month,
                year: year
            })
        });

        const data = await res.json();

        if (!data || !data.success) {
            resultDiv.innerHTML = `
                <div class="text-red-600 text-center">
                    <p class="text-lg">❌ ไม่สามารถดึงข้อมูลรางวัลได้</p>
                </div>
            `;
            return;
        }

        const lottoData = data.data.response.result.data;
        const formattedDate = formatThaiDate(selectedDate);
        
        let html = `
            <div class="mb-4">
                <h3 class="text-xl font-bold text-gray-800 mb-3">ผลการตรวจสอบงวดวันที่ ${formattedDate}</h3>
            </div>
            <div class="space-y-3">
        `;
        
        for (const number of numbers) {
            let prizes = [];
            
            // ตรวจสอบรางวัลที่ 1
            if (lottoData.first?.number[0]?.value === number) {
                prizes.push("รางวัลที่ 1 (6,000,000 บาท)");
            }
            
            // ตรวจสอบรางวัลที่ 2
            if (lottoData.second?.number && lottoData.second.number.some(item => item.value === number)) {
                prizes.push("รางวัลที่ 2 (200,000 บาท)");
            }
            
            // ตรวจสอบรางวัลที่ 3
            if (lottoData.third?.number && lottoData.third.number.some(item => item.value === number)) {
                prizes.push("รางวัลที่ 3 (80,000 บาท)");
            }
            
            // ตรวจสอบรางวัลที่ 4
            if (lottoData.fourth?.number && lottoData.fourth.number.some(item => item.value === number)) {
                prizes.push("รางวัลที่ 4 (40,000 บาท)");
            }
            
            // ตรวจสอบรางวัลที่ 5
            if (lottoData.fifth?.number && lottoData.fifth.number.some(item => item.value === number)) {
                prizes.push("รางวัลที่ 5 (20,000 บาท)");
            }
            
            // ตรวจสอบเลขหน้า 3 ตัว (last3f) - เอาเลข 3 ตัวแรกของเลข 6 หลัก
            const front3Digits = number.substring(0, 3);
            if (lottoData.last3f?.number && lottoData.last3f.number.some(item => item.value === front3Digits)) {
                prizes.push("เลขหน้า 3 ตัว (4,000 บาท)");
            }
            
            // ตรวจสอบเลขท้าย 3 ตัว (last3b) - เอาเลข 3 ตัวท้ายของเลข 6 หลัก
            const last3Digits = number.substring(3, 6);
            if (lottoData.last3b?.number && lottoData.last3b.number.some(item => item.value === last3Digits)) {
                prizes.push("เลขท้าย 3 ตัว (4,000 บาท)");
            }
            
            // ตรวจสอบเลขท้าย 2 ตัว (last2) - เอาเลข 2 ตัวท้ายของเลข 6 หลัก
            const last2Digits = number.substring(4, 6);
            if (lottoData.last2?.number && lottoData.last2.number.some(item => item.value === last2Digits)) {
                prizes.push("เลขท้าย 2 ตัว (2,000 บาท)");
            }
            
            // ตรวจสอบรางวัลข้างเคียงรางวัลที่ 1 (near1)
            if (lottoData.near1?.number && lottoData.near1.number.some(item => item.value === number)) {
                prizes.push("รางวัลข้างเคียงรางวัลที่ 1 (100,000 บาท)");
            }
            
            // แสดงผลลัพธ์
            if (prizes.length > 0) {
                const prizeText = prizes.join(", ");
                html += `
                    <div class="bg-green-50 border-l-4 border-green-500 p-4 rounded-r-lg">
                        <div class="flex items-center">
                            <span class="text-green-500 mr-3">🎉</span>
                            <div>
                                <strong class="text-lg text-gray-800">${number}</strong>
                                <p class="text-green-700 font-medium">${prizeText}</p>
                            </div>
                        </div>
                    </div>
                `;
            } else {
                html += `
                    <div class="bg-gray-50 border-l-4 border-gray-400 p-4 rounded-r-lg">
                        <div class="flex items-center">
                            <span class="text-gray-500 mr-3">❌</span>
                            <div>
                                <strong class="text-lg text-gray-800">${number}</strong>
                                <p class="text-gray-600">ไม่ถูกรางวัล</p>
                            </div>
                        </div>
                    </div>
                `;
            }
        }
        
        html += `</div>`;
        resultDiv.innerHTML = html;
        if (window.LekAnalytics) LekAnalytics.track('result_checked');

    } catch (err) {
        console.error("Error during API call:", err);
        resultDiv.innerHTML = `
            <div class="text-red-600 text-center">
                <p class="text-lg">❌ เกิดข้อผิดพลาดในการเชื่อมต่อกับ API</p>
            </div>
        `;
    }
}

// ฟังก์ชันสำหรับจัดการการกด Enter ในช่องกรอกเลขหวย
function handleEnterKey(event) {
    if (event.key === 'Enter') {
        event.preventDefault(); // ป้องกันการ submit form
        checkLottoAndLoadFullResults();
    }
}

// ฟังก์ชันเมื่อมีการเปลี่ยนวันที่
function onDateChange() {
    const selectedDate = document.getElementById("lottoDate").value;
    loadLottoResultsForDate(selectedDate);
}

// ฟังก์ชันเปิด/ปิดรายการรางวัลจำนวนมาก
function togglePrize(button, listId) {
    const list = document.getElementById(listId);
    if (!list) return;
    const isOpen = !list.classList.toggle('hidden');
    button.setAttribute('aria-expanded', isOpen ? 'true' : 'false');
    const icon = button.querySelector('i.fa-chevron-down');
    if (icon) icon.style.transform = isOpen ? 'rotate(180deg)' : '';
}

// ฟังก์ชันสำหรับตรวจสอบความถูกต้องของข้อมูลหวย
function validateLottoData(lottoData) {
    try {
        if (!lottoData || typeof lottoData !== 'object') {
            return {
                is_valid: false,
                error: "ข้อมูลไม่ใช่รูปแบบที่ถูกต้อง"
            };
        }
        
        // ตรวจสอบว่ามีข้อมูลรางวัลที่จำเป็นหรือไม่
        const requiredFields = ['first', 'second', 'third', 'fourth', 'fifth'];
        const missingFields = [];
        
        for (const field of requiredFields) {
            if (!lottoData[field]) {
                missingFields.push(field);
            } else if (!lottoData[field].number || !Array.isArray(lottoData[field].number)) {
                missingFields.push(field);
            }
        }
        
        if (missingFields.length > 0) {
            return {
                is_valid: false,
                error: `ข้อมูลไม่ครบถ้วน: ขาด ${missingFields.join(', ')}`
            };
        }
        
        // ตรวจสอบว่าข้อมูลไม่ว่างเปล่า
        for (const field of requiredFields) {
            if (!lottoData[field].number || lottoData[field].number.length === 0) {
                return {
                    is_valid: false,
                    error: `ข้อมูล ${field} ว่างเปล่า`
                };
            }
        }
        
        return {
            is_valid: true,
            message: "ข้อมูลถูกต้อง"
        };
        
    } catch (error) {
        console.error("Error validating lotto data:", error);
        return {
            is_valid: false,
            error: `เกิดข้อผิดพลาดในการตรวจสอบ: ${error.message}`
        };
    }
}

// ฟังก์ชันสำหรับอัปเดตข้อมูลจากกองสลาก
async function refreshDataFromGLO() {
    const selectedDate = document.getElementById("lottoDate").value;
    const displayDiv = document.getElementById("latestLottoResult");
    
    // แสดงสถานะกำลังอัปเดต
    displayDiv.innerHTML = `
        <div class="text-center">
            <div class="inline-block w-8 h-8 bg-green-400 rounded-full animate-spin mb-4"></div>
            <p class="text-lg text-gray-600">🔄 กำลังอัปเดตข้อมูลจาก API กองสลาก...</p>
            <p class="text-sm text-gray-500 mt-2">กรุณารอสักครู่</p>
        </div>
    `;
    
    const dateParts = selectedDate.split('-');
    const year = dateParts[0];
    const month = dateParts[1];
    const date = dateParts[2];
    
    try {
        // เรียกใช้ API refresh เพื่อดึงข้อมูลใหม่จากกองสลาก
        const res = await fetch("/lottery_checker/api/lotto/refresh/", {
            method: "POST",
            headers: {
                "Content-Type": "application/json",
                "X-CSRFToken": getCSRFToken()
            },
            body: JSON.stringify({
                date: date,
                month: month,
                year: year
            })
        });
        
        const data = await res.json();
        
        if (data.success) {
            // แสดงข้อความสำเร็จ
            displayDiv.innerHTML = `
                <div class="text-center text-green-600">
                    <div class="mb-4">
                        <svg class="w-16 h-16 mx-auto text-green-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path>
                        </svg>
                    </div>
                    <p class="text-xl font-semibold">✅ อัปเดตข้อมูลสำเร็จ!</p>
                    <p class="text-sm text-gray-600 mt-2">${data.message}</p>
                    <div class="mt-4">
                        <p class="text-sm text-gray-500">กำลังโหลดข้อมูลใหม่...</p>
                    </div>
                </div>
            `;
            
            // โหลดข้อมูลใหม่หลังจาก 1 วินาที
            setTimeout(() => {
                loadLottoResultsForDate(selectedDate);
            }, 1000);
            
        } else {
            // แสดงข้อความผิดพลาด
            displayDiv.innerHTML = `
                <div class="text-center text-red-600">
                    <div class="mb-4">
                        <svg class="w-16 h-16 mx-auto text-red-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
                        </svg>
                    </div>
                    <p class="text-xl font-semibold">❌ อัปเดตข้อมูลไม่สำเร็จ</p>
                    <p class="text-sm text-gray-600 mt-2">${data.error || 'เกิดข้อผิดพลาดที่ไม่ทราบสาเหตุ'}</p>
                    <div class="mt-4">
                        <button 
                            onclick="refreshDataFromGLO()" 
                            class="bg-gradient-to-r from-red-600 to-pink-600 hover:from-red-700 hover:to-pink-700 text-white font-bold py-3 px-6 rounded-xl transition-all duration-300 transform hover:scale-105 shadow-lg mr-3"
                        >
                            🔄 ลองใหม่
                        </button>
                        <button 
                            onclick="loadLottoResultsForDate(selectedDate)" 
                            class="bg-gradient-to-r from-gray-600 to-gray-700 hover:from-gray-700 hover:to-gray-800 text-white font-bold py-3 px-6 rounded-xl transition-all duration-300 transform hover:scale-105 shadow-lg"
                        >
                            📋 ดูข้อมูลเดิม
                        </button>
                    </div>
                </div>
            `;
        }
        
    } catch (err) {
        console.error("Error refreshing lotto data:", err);
        displayDiv.innerHTML = `
            <div class="text-center text-red-600">
                <div class="mb-4">
                    <svg class="w-16 h-16 mx-auto text-red-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
                    </svg>
                </div>
                <p class="text-xl font-semibold">❌ เกิดข้อผิดพลาดในการเชื่อมต่อ</p>
                <p class="text-sm text-gray-600 mt-2">กรุณาลองใหม่อีกครั้ง</p>
                <div class="mt-4">
                    <button 
                        onclick="refreshDataFromGLO()" 
                        class="bg-gradient-to-r from-red-600 to-pink-600 hover:from-red-700 hover:to-pink-700 text-white font-bold py-3 px-6 rounded-xl transition-all duration-300 transform hover:scale-105 shadow-lg mr-3"
                    >
                        🔄 ลองใหม่
                    </button>
                    <button 
                        onclick="loadLottoResultsForDate(selectedDate)" 
                        class="bg-gradient-to-r from-gray-600 to-gray-700 hover:from-gray-700 hover:to-gray-800 text-white font-bold py-3 px-6 rounded-xl transition-all duration-300 transform hover:scale-105 shadow-lg"
                    >
                        📋 ดูข้อมูลเดิม
                    </button>
                </div>
            </div>
        `;
    }
}



// เมื่อหน้าเว็บโหลดเสร็จ
document.addEventListener('DOMContentLoaded', () => {
    const initialSelectedDate = document.getElementById("lottoDate").value;
    loadLottoResultsForDate(initialSelectedDate);
});
</script>
