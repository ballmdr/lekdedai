name: CI

on:
  push:
  pull_request:

jobs:
  quality-gate:
    runs-on: ubuntu-latest
    env:
      SECRET_KEY: ci-insecure-secret-key-for-tests-only-0123456789abcdef
      DEBUG: "False"
      DATABASE_URL: sqlite:///db.sqlite3
      ALLOW_MOCK_INGESTION: "False"
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run quality gate
        run: python app/manage.py quality_gate
