{# เมนูหลัก (Task 31) — ใช้ร่วมทุกหน้า มี active state + aria-current #}
<nav class="bg-white shadow-lg border-b-4 border-primary sticky top-0 z-40" aria-label="เมนูหลัก">
    <div class="container mx-auto px-4">
        <div class="flex justify-between items-center py-3">
            <a href="/" class="flex items-center gap-2 shrink-0" aria-label="LekdeDai หน้าแรก">
                <span class="w-10 h-10 bg-primary rounded-lg flex items-center justify-center">
                    <span class="text-primary-foreground font-bold text-xl" aria-hidden="true">หวย</span>
                </span>
                <span class="text-2xl font-bold text-gray-800">LekdeDai</span>
            </a>

            <div class="hidden lg:flex items-center gap-1">
                {% for item in main_nav %}
                <a href="{{ item.href }}"
                   {% if item.active %}aria-current="page"{% endif %}
                   class="px-3 py-2 rounded-lg text-sm font-medium transition-colors {% if item.active %}bg-primary/20 text-foreground{% else %}text-gray-700 hover:bg-gray-50 hover:text-primary{% endif %}">
                    <i aria-hidden="true" class="fas {{ item.icon }} mr-1"></i>{{ item.label }}
                </a>
                {% endfor %}
            </div>

            <button id="navToggle" type="button"
                    class="lg:hidden p-2 rounded-lg text-gray-700 hover:bg-gray-100"
                    aria-label="เปิดเมนูหลัก" aria-controls="mobileNav" aria-expanded="false">
                <i aria-hidden="true" class="fas fa-bars text-xl"></i>
            </button>
        </div>

        <div id="mobileNav" class="hidden lg:hidden border-t border-border">
            <div class="flex flex-col py-2 gap-1">
                {% for item in main_nav %}
                <a href="{{ item.href }}"
                   {% if item.active %}aria-current="page"{% endif %}
                   class="flex items-center gap-3 px-3 py-3 rounded-lg {% if item.active %}bg-primary/20 font-semibold text-foreground{% else %}text-gray-700 hover:bg-gray-50{% endif %}">
                    <i aria-hidden="true" class="fas {{ item.icon }} w-5 text-center"></i>{{ item.label }}
                </a>
                {% endfor %}
            </div>
        </div>
    </div>
</nav>
